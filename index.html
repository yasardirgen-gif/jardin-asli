<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jardin d'Aslı">
<meta name="theme-color" content="#151833">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>html,body{margin:0}</style>
<script src="shim.js"></script>
<title>Le Jardin d'Aslı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Concept : un petit jeu 8-bit. Une tulipe pousse à chaque leçon, le jardin se remplit avec les cadeaux. */
:root{
  --bg:#151833; --bg2:#1d2146; --panel:#2a2f66; --panel2:#3a4190; --ink:#0c0e20;
  --text:#f6f2ff; --dim:#b9bdf0;
  --red:#ff4d5e; --gold:#ffd24a; --green:#4fe08c; --blue:#5ab4ff; --pink:#ff8fca; --violet:#a088ff; --bad:#ff6b6b;
  --f-px:'Press Start 2P','Courier New',monospace;
  --f-body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:24px;line-height:1.12;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 130px;
  -webkit-tap-highlight-color:transparent;
}
#stars{position:fixed;left:0;top:0;width:4px;height:4px;pointer-events:none;animation:tw 2.4s steps(2) infinite;z-index:0}
@keyframes tw{50%{opacity:.35}}
#app,#navin{max-width:560px;margin:0 auto;position:relative;z-index:1}
button{font-family:inherit}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.fr{display:block}
.tr{display:block;font-size:.72em;opacity:.8;line-height:1.1}
.h1 .tr,.h2 .tr{font-family:var(--f-body);font-size:20px;line-height:1.1;margin-top:2px}
.bella{display:flex;align-items:center;gap:12px;margin:10px 4px}
.bella canvas{image-rendering:pixelated;width:96px;height:96px;flex:none}
.bubble{background:var(--panel);padding:10px 12px;font-size:22px;flex:1;min-width:0}
.xg{display:grid;gap:3px;justify-content:center;margin:12px auto}
.xc{width:34px;height:34px;position:relative}
.xc input{width:100%;height:100%;text-align:center;font-size:24px;text-transform:uppercase;background:#fff;color:var(--ink);border:0;padding:0;font-family:var(--f-body);border-radius:0}
.xc input.ok{background:var(--green)}
.xc input.no{background:#ff9aa0}
.xc i{position:absolute;left:2px;top:0;font-size:9px;font-style:normal;color:var(--ink);font-family:var(--f-px);pointer-events:none;z-index:1}
.xclue{display:flex;align-items:center;gap:8px;margin:6px 4px}
.navrow{margin:0 4px}
.navrow .btn{font-size:22px;padding:8px 10px 12px;margin:8px 4px;flex:1}
.pimg{max-width:100%;max-height:260px;display:block;margin:8px auto}
.pl{padding:10px;margin:8px 4px;background:var(--ink)}
.pl.good{border-left:6px solid var(--green)}
.pl.bad{border-left:6px solid var(--bad)}
.flash .emo{font-size:44px}
.ver{text-align:center;opacity:.6;font-size:16px;margin:10px 0}
.emo{font-size:64px;line-height:1.1;margin:6px 0}
.pron{margin:12px 4px;padding:12px;text-align:center;background:var(--ink)}
.pron.good{background:#1f6b49}
.pron.bad{background:#7a2a46}
.pron .fbh{margin-bottom:4px}
.px{position:relative;margin:4px;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.panel{background:var(--panel);padding:16px;margin-block:16px}
.h1{font-family:var(--f-px);font-size:15px;line-height:1.7;margin:4px 0 6px}
.h2{font-family:var(--f-px);font-size:11px;line-height:1.7;margin:22px 0 10px;color:var(--gold)}
.sub{color:var(--dim);margin-bottom:8px}
.big{font-size:46px;line-height:1.05;text-align:center;margin:10px 0;overflow-wrap:anywhere}
.ic{display:inline-block;vertical-align:middle;image-rendering:pixelated;flex:none}
small{font-size:.8em}

/* boutons */
.btn{display:block;width:calc(100% - 8px);margin:14px 4px;border:0;padding:12px 14px 16px;cursor:pointer;text-align:center;font-size:26px;color:var(--ink);background:var(--gold);
  box-shadow:inset -4px -6px 0 0 rgba(0,0,0,.28),inset 4px 4px 0 0 rgba(255,255,255,.35),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:inset -4px -2px 0 0 rgba(0,0,0,.28),inset 4px 4px 0 0 rgba(255,255,255,.35),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.mini{border:0;background:var(--panel2);color:var(--text);width:52px;height:48px;cursor:pointer;display:grid;place-items:center;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);margin:4px}

/* jardin */
.garden{height:210px;overflow:hidden;background:linear-gradient(#2a2a6e 0 25%,#4a3a8c 25% 50%,#8a4a96 50% 75%,#d9708f 75% 100%);margin-block:14px}
.sun{position:absolute;right:28px;top:26px;width:28px;height:28px;background:var(--gold);box-shadow:0 -4px 0 var(--gold),0 4px 0 var(--gold),-4px 0 0 var(--gold),4px 0 0 var(--gold)}
.cloud{position:absolute;width:8px;height:8px;background:#ffe9f4;opacity:.9;
  box-shadow:8px 0 #ffe9f4,16px 0 #ffe9f4,-8px -8px #ffe9f4,0 -8px #ffe9f4,8px -8px #ffe9f4,16px -8px #ffe9f4;animation:drift 38s linear infinite}
.cloud.c1{top:52px;left:-40px}
.cloud.c2{top:100px;left:-120px;animation-duration:52s;scale:.75}
@keyframes drift{to{translate:720px 0}}
.grass{position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(#3fbf6a 0 8px,#2e9a55 8px 22px,#7a4f33 22px 100%)}
.beds{position:absolute;left:10px;right:10px;bottom:30px;display:flex;align-items:flex-end;justify-content:center;gap:6px;flex-wrap:nowrap;overflow:hidden}
.beds canvas{width:54px;height:72px;image-rendering:pixelated;flex:none;animation:sway 1.6s steps(2) infinite}
.beds canvas:nth-child(2n){animation-delay:.4s}
.beds canvas:nth-child(3n){animation-delay:.8s}
@keyframes sway{50%{transform:translateX(3px)}}
.xp{display:flex;align-items:center;gap:12px;background:var(--panel);padding:10px 14px;margin-block:16px}
.lv{font-family:var(--f-px);font-size:10px;color:var(--gold)}
.xpn{font-size:20px;color:var(--dim)}
.bar{flex:1;height:18px;background:var(--ink);padding:3px;min-width:0}
.bar i{display:block;height:100%;background:var(--green);transition:width .5s steps(8)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 4px}
.tile{background:var(--panel);padding:10px 6px 12px;text-align:center;margin:4px}
.tile b{display:block;font-family:var(--f-px);font-size:15px;margin:6px 0 4px;font-weight:400}
.tile span{font-size:20px;color:var(--dim)}
.tile .fr{font-size:20px}
.tile .tr{font-size:16px}

/* cartes parcours */
.unit{display:flex;gap:12px;align-items:center;width:calc(100% - 8px);background:var(--panel);border:0;color:var(--text);text-align:left;padding:12px;margin:12px 4px;cursor:pointer}
.unit:active{transform:translateY(3px)}
.unit.done{background:#27507a}
.unit .num{font-family:var(--f-px);font-size:13px;background:var(--ink);padding:10px 9px;min-width:44px;text-align:center;color:var(--gold)}
.unit .ut{flex:1;min-width:0}
.unit .ut b{display:block;font-weight:400;font-size:28px}
.unit .ut small{color:var(--dim);font-size:22px}
.tabs{display:flex;gap:8px;margin:10px 4px 6px}
.tab{flex:1;border:0;background:var(--panel);color:var(--dim);padding:10px 2px;font-family:var(--f-px);font-size:12px;cursor:pointer;margin:4px;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.tab.on{background:var(--gold);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 4px}
.chip{border:0;background:var(--panel2);color:var(--text);padding:8px 12px 10px;font-size:26px;cursor:pointer;margin:4px;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.chip.on{background:var(--gold);color:var(--ink)}
.chip.wide{flex:1 1 100%;text-align:left}

/* séance */
.runbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timer{font-family:var(--f-px);font-size:20px;color:var(--gold)}
.prog{height:20px;background:var(--ink);padding:4px;margin-block:14px}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s steps(8)}
.part{font-family:var(--f-px);font-size:10px;color:var(--pink);margin:0 4px 6px}
.over{color:var(--gold);text-align:center;margin:4px}
.card{background:var(--panel);padding:16px;margin-block:12px;min-height:220px}
.qh{color:var(--dim);margin-bottom:8px}
.listen{display:flex;gap:10px;justify-content:center;margin:10px 0}
.spk{border:0;background:var(--blue);color:var(--ink);padding:8px 14px;display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:20px;margin:4px;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.spk.slow{background:var(--violet)}
.spk:active{transform:translateY(3px)}
.spk .tr,.spk .fr{display:inline;font-size:1em;opacity:1}
.spk .tr::before{content:' · '}
.opts{display:grid;gap:14px;margin-top:14px}
.opt{border:0;background:var(--panel2);color:var(--text);padding:12px 14px 14px;font-size:27px;text-align:left;cursor:pointer;margin:4px;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);overflow-wrap:anywhere}
.opt:active{transform:translateY(3px)}
.opt.ok{background:var(--green);color:var(--ink)}
.opt.no{background:var(--red);color:#fff;animation:shake .35s steps(4)}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.text{background:var(--ink);padding:12px;margin:6px 0 12px;font-size:28px}
.qq{margin:8px 0}
.inp{width:calc(100% - 8px);margin:10px 4px;background:var(--ink);color:var(--text);border:0;padding:12px;font-size:30px;font-family:var(--f-body);
  box-shadow:0 -4px 0 0 var(--blue),0 4px 0 0 var(--blue),-4px 0 0 0 var(--blue),4px 0 0 0 var(--blue)}
.acc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 4px 10px}
.key{border:0;background:var(--panel2);color:var(--text);font-size:28px;min-width:44px;height:46px;cursor:pointer;margin:2px;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.zone{min-height:74px;background:var(--ink);padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 4px;align-content:flex-start}
.tile2{border:0;background:var(--gold);color:var(--ink);font-size:26px;padding:6px 12px 8px;cursor:pointer;margin:2px;
  box-shadow:inset -3px -4px 0 rgba(0,0,0,.28),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.zone.ans .tile2{background:var(--blue)}
.say{color:var(--dim);margin:6px 4px;text-align:center;min-height:26px}
.fb{padding:14px 16px;margin-block:18px;background:var(--panel);animation:rise .3s steps(4)}
.fb.good{background:#1f6b49}
.fb.bad{background:#7a2a46}
.fbh{font-family:var(--f-px);font-size:12px;line-height:1.7;margin-bottom:6px}
.fbc{font-size:26px}
.fbc i{color:var(--gold);font-style:normal}
.diff span{padding:0 4px;margin-right:4px;display:inline-block}
.diff .g{background:var(--green);color:var(--ink)}
.diff .w{background:var(--gold);color:var(--ink)}
.diff .r{background:var(--red);color:#fff}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.pop{animation:rise .3s steps(4)}

/* leçon */
.flash{text-align:center;padding:18px 12px 22px}
.flash .fw{font-size:54px;margin:10px 0 4px;overflow-wrap:anywhere}
.flash .tw{font-size:34px;color:var(--gold);margin-bottom:12px}
.flash .ex{background:var(--ink);padding:10px;margin-top:12px;font-size:26px}
.flash .ex small{display:block;color:var(--dim);margin-top:4px}
.dots{display:flex;gap:4px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.dots i{width:10px;height:10px;background:var(--ink)}
.dots i.on{background:var(--gold)}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:24px}
.wl div{min-width:0;overflow-wrap:anywhere}
.wl .t{color:var(--dim)}

/* calendrier */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 4px}
.cal .hd{font-family:var(--f-px);font-size:9px;color:var(--dim);text-align:center;padding:6px 0}
.day{border:0;aspect-ratio:1;min-width:0;background:var(--panel);color:var(--text);font-size:24px;padding:3px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.day small{font-size:16px;color:inherit;opacity:.85;min-height:14px}
.day.l1{background:#27507a}
.day.l2{background:#1f7a6a}
.day.l3{background:#2fa35f;color:var(--ink)}
.day.l4{background:var(--green);color:var(--ink)}
.day.today{box-shadow:0 0 0 4px var(--gold)}
.day.sel{box-shadow:0 0 0 4px var(--pink)}
.day.void{background:transparent;cursor:default}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav .h1{margin:0;text-align:center;flex:1}
.legend{display:flex;gap:6px;align-items:center;font-size:18px;color:var(--dim);margin:4px;flex-wrap:wrap}
.legend i{width:16px;height:16px;display:inline-block}

/* cadeaux */
.gifts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:10px 4px}
.gift{background:var(--panel);padding:12px 8px 14px;text-align:center;margin:4px;min-width:0}
.gift canvas{width:45px;height:60px;image-rendering:pixelated;display:block;margin:0 auto 6px}
.gift.lock canvas{filter:brightness(0) opacity(.45)}
.gift b{display:block;font-weight:400;font-size:24px}
.gift small{display:block;color:var(--dim);font-size:20px;margin:2px 0 6px}
.gift .btn{margin:8px 0 2px;width:100%;font-size:22px;padding:8px 6px 12px}
.gift.open{background:#27507a}
.box{width:96px;height:96px;margin:10px auto;position:relative;animation:shake .5s steps(4) 3}
.box .b1{position:absolute;left:0;right:0;bottom:0;height:60px;background:var(--red);box-shadow:inset -8px -8px 0 rgba(0,0,0,.25)}
.box .b2{position:absolute;left:-8px;right:-8px;top:8px;height:32px;background:var(--pink);box-shadow:inset -8px -6px 0 rgba(0,0,0,.2);animation:lid 1.5s steps(6) forwards}
.box .rb{position:absolute;left:40px;width:16px;top:8px;bottom:0;background:var(--gold)}
@keyframes lid{0%,60%{transform:none}100%{transform:translate(18px,-46px) rotate(18deg);opacity:0}}
.reveal canvas{width:90px;height:120px;image-rendering:pixelated;display:block;margin:6px auto;animation:rise .6s steps(6) 1.4s both}
.msg{background:var(--ink);padding:12px;margin:10px 4px;font-size:26px}
.msg small{display:block;color:var(--dim);margin-top:6px}

/* résumé */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 4px}
.sum .tile b{font-size:17px}
.warn{background:#5a3a14;padding:10px 12px;margin:10px 4px;font-size:22px}
textarea.inp{font-size:18px;min-height:96px;resize:vertical;word-break:break-all}
select.inp{font-size:26px}
label{display:block;margin:12px 4px 2px;color:var(--dim)}

/* navigation */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);padding:8px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
#nav[hidden]{display:none}
#navin{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nb{border:0;background:transparent;color:var(--dim);padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:17px;line-height:1;position:relative;min-width:0}
.nb .fr,.nb .tr{text-align:center}
.nb .fr{font-size:17px}
.nb .tr{font-size:14px}
.nb.on{color:var(--gold)}
.nb .dot{position:absolute;top:2px;right:22%;width:10px;height:10px;background:var(--red)}
#toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:10px 14px;z-index:60;max-width:90vw;box-shadow:0 0 0 4px var(--ink);animation:rise .3s steps(4)}
#overlay{position:fixed;inset:0;z-index:50;background:rgba(8,9,24,.82);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px))}
#overlay[hidden]{display:none}
#overlay .modal{background:var(--panel);padding:18px;width:min(100%,460px);max-height:88vh;overflow:auto;margin:4px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#fx i{position:absolute;top:-12px;width:10px;height:10px;animation:fall 1.8s steps(14) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(180deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .cloud{animation:none}
}
</style>
</head><body>


<div id="stars" aria-hidden="true"></div>
<div id="app"></div>
<nav id="nav" aria-label="Navigation"><div id="navin"></div></nav>
<div id="overlay" hidden></div>
<div id="fx" aria-hidden="true"></div>

<script>
(function(){
'use strict';

/* ───────── Données du cours : A0 vers A1 ───────── */
/* chaque mot : [français, turc, phrase d'exemple, traduction de la phrase] */
const WEEKS={
  1:{fr:"Premiers mots",tr:"İlk kelimeler"},
  2:{fr:"Mon monde",tr:"Benim dünyam"},
  3:{fr:"Au quotidien",tr:"Günlük hayat"},
  4:{fr:"Dehors",tr:"Dışarıda"}
};
const UNITS=[
{id:1,wk:1,fr:"Saluer",tr:"Selamlaşma",w:[
["Bonjour","Merhaba (gündüz)","Bonjour, madame !","Merhaba, hanımefendi!"],
["Bonsoir","İyi akşamlar","Bonsoir, monsieur !","İyi akşamlar, beyefendi!"],
["Salut","Selam","Salut, Aslı !","Selam, Aslı!"],
["Au revoir","Hoşça kal / Görüşürüz","Au revoir, à demain !","Güle güle, yarın görüşürüz!"],
["Bonne nuit","İyi geceler","Bonne nuit, ma chérie.","İyi geceler, canım."],
["Merci","Teşekkürler","Merci beaucoup !","Çok teşekkürler!"],
["S'il vous plaît","Lütfen","Un café, s'il vous plaît.","Bir kahve, lütfen."],
["Pardon","Pardon / Affedersiniz","Pardon, madame.","Affedersiniz, hanımefendi."],
["Oui","Evet","Oui, c'est bon.","Evet, tamam."],
["Non","Hayır","Non, merci beaucoup.","Hayır, çok teşekkürler."],
["Ça va ?","Nasılsın?","Ça va bien, merci.","İyiyim, teşekkürler."]
]},
{id:2,wk:1,fr:"Se présenter",tr:"Kendini tanıtma",w:[
["Je m'appelle","Benim adım …","Je m'appelle Aslı.","Benim adım Aslı."],
["Comment tu t'appelles ?","Adın ne?","Salut ! Comment tu t'appelles ?","Selam! Adın ne?"],

  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(JSON.parse(JSON.stringify(DEF)),o);}}catch(e){storageOk=false;}
  return JSON.parse(JSON.stringify(DEF));
}
let S=load(),lastSave=0,saveT=0;
function save(now){
  const go=()=>{S.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOk=false;}lastSave=Date.now();cloudDirty();};
  if(now){clearTimeout(saveT);saveT=0;go();}
  else if(Date.now()-lastSave>3000)go();
  else if(!saveT)saveT=setTimeout(()=>{saveT=0;go();},3000);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true);});
window.addEventListener('pagehide',()=>save(true));
const enc=o=>{const by=new TextEncoder().encode(JSON.stringify(o));let s='';by.forEach(x=>s+=String.fromCharCode(x));return btoa(s);};
const dec=c=>{const s=atob(c.replace(/\s+/g,''));return JSON.parse(new TextDecoder().decode(Uint8Array.from(s,ch=>ch.charCodeAt(0))));};

let cloudRef=null,cloudSt='off',cloudT=0,cloudBusy=false,cloudAgain=false;
function cloudDirty(){if(!cloudRef||cloudT)return;cloudT=setTimeout(()=>{cloudT=0;cloudPush();},5000);}
async function cloudPush(){
  if(!cloudRef)return;if(cloudBusy){cloudAgain=true;return;}
  cloudBusy=true;
  try{await cloudRef.set({upd:S.upd||Date.now(),code:enc(S)});cloudSt='ok';}catch(e){cloudSt='err';}
  cloudBusy=false;if(cloudAgain){cloudAgain=false;cloudDirty();}
  const el=$('#cloudst');if(el)el.innerHTML=cloudHtml();
}
function cloudHtml(){
  return cloudSt==='ok'?'☁️ '+b('Progression sauvegardée en ligne','İlerleme çevrimiçi kaydedildi'):
   '⚠️ '+b("Sauvegardée seulement sur cet appareil. Utilise le code dans Réglages.","Yalnızca bu cihazda kayıtlı. Ayarlar'daki kodu kullan.");
}
async function cloudInit(){
  try{
    const db=await window.claude.use('db'),user=await window.claude.use('user');
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    cloudRef=db.doc('data/users/'+id+'/progress');
    const snap=await cloudRef.get();
    if(snap.exists){
      const d=snap.data();
      if(d&&d.code&&(d.upd||0)>(S.upd||0)){
        const o=dec(d.code);
        if(o&&o.days){S=Object.assign(JSON.parse(JSON.stringify(DEF)),o);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
          if(!learning){render();toast(b('Progression retrouvée en ligne !','İlerleme çevrimiçi bulundu!'));}}
      }else if(!d||(d.upd||0)<(S.upd||0)){await cloudPush();}
    }else if(S.upd){await cloudPush();}
    cloudSt='ok';
    const el=$('#cloudst');if(el)el.innerHTML=cloudHtml();
  }catch(e){cloudSt='err';}
}

const day=(k)=>{k=k||todayK();return S.days[k]||(S.days[k]={sec:0,xp:0,ex:0,ok:0});};

function diffDays(a,c){return Math.round((new Date(c+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
const dayOK=k=>{const d=S.days[k];return !!d&&d.sec>=120;};
function streaks(){
  const keys=Object.keys(S.days).filter(dayOK).sort();let best=0,run=0,prev=null;
  keys.forEach(k=>{run=(prev&&diffDays(prev,k)===1)?run+1:1;best=Math.max(best,run);prev=k;});
  let cur=0;const d=new Date();if(!dayOK(dkey(d)))d.setDate(d.getDate()-1);
  while(dayOK(dkey(d))){cur++;d.setDate(d.getDate()-1);}
  return {cur,best};
}
const totalSec=()=>Object.values(S.days).reduce((a,d)=>a+(d.sec||0),0);
const totalEx=()=>Object.values(S.days).reduce((a,d)=>[a[0]+(d.ex||0),a[1]+(d.ok||0)],[0,0]);
const recUnit=()=>UNITS.find(u=>!(S.units[u.id]&&S.units[u.id].done))||null;
const giftReady=g=>g.k==='s'?streaks().best>=g.need:totalSec()>=g.need*3600;

let AC=null;
function beep(f,d,t,v,delay){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();
    o.type=t||'square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+(delay||0);
    g.gain.setValueAtTime(v||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.start(t0);o.stop(t0+d+.03);}catch(e){}
}

function targetFor(w,biasWord){
  if(/[…\/()]/.test(w.fr))return w.xf;
  return Math.random()<biasWord?w.fr:w.xf;
}
function distract(w,f,n){
  const same=shuffle(ALLW.filter(x=>x.u===w.u&&x.fr!==w.fr)),rest=shuffle(ALLW.filter(x=>x.u!==w.u));
  const out=[],seen=new Set([w[f]]);
  [...same.slice(0,2),...rest,...same.slice(2)].forEach(x=>{if(out.length<n&&!seen.has(x[f])){seen.add(x[f]);out.push(x);}});
  return out;
}
function mkMcq(kind,w){
  const toTr=kind==='fr2tr'||kind==='listenTr';
  const f=toTr?'tr':'fr';
  const opts=shuffle([{html:esc(w[f]),ok:true},...distract(w,f,3).map(x=>({html:esc(x[f]),ok:false}))]);
  const ex={kind:'mcq',w,opts,info:{correct:exInfo(w),say:w.fr}};
  if(kind==='fr2tr'){ex.head=b('Que veut dire ce mot ?','Bu kelime ne demek?');ex.say=w.fr;ex.prompt='<div class="big">'+esc(w.fr)+'</div>';}
  if(kind==='tr2fr'){ex.head=b('Comment dit-on en français ?','Fransızcada nasıl denir?');ex.prompt='<div class="big">'+esc(w.tr)+'</div>';}
  if(kind==='listenFr'){ex.head=b('Écoute et choisis le bon mot','Dinle ve doğru kelimeyi seç');ex.say=w.fr;}
  if(kind==='listenTr'){ex.head=b('Écoute : que veut dire ce mot ?','Dinle: bu kelime ne demek?');ex.say=w.fr;}
  return ex;
}
function mkEx(t,w){
  if(['fr2tr','tr2fr','listenFr','listenTr'].includes(t))return mkMcq(t,w);
  if(t==='dictee'){const tg=targetFor(w,.6);return {kind:'write',w,target:tg,say:tg,head:b('Écoute et écris ce que tu entends','Dinle ve duyduğunu yaz'),prompt:'',info:{correct:exInfo(w),say:tg}};}
  if(t==='type'){const tg=targetFor(w,.3);return {kind:'write',w,target:tg,head:b('Écris en français','Fransızca yaz'),prompt:'<div class="big">'+esc(tg===w.fr?w.tr:w.xt)+'</div>',info:{correct:exInfo(w),say:tg}};}
  if(t==='repeat'){const tg=targetFor(w,.5);return {kind:'repeat',w,target:tg,info:{correct:exInfo(w),say:tg}};}
  if(t==='order'){if(toks(w.xf).length<3)return mkMcq('fr2tr',w);return {kind:'order',w,target:w.xf,head:b('Remets les mots dans l\'ordre','Kelimeleri sıraya diz'),prompt:'<div class="big">'+esc(w.xt)+'</div>',info:{correct:exInfo(w),say:w.xf}};}
  return mkMcq('fr2tr',w);
}
function weight(w,cur,last){
  const s=S.words[w.fr];let x=(!s||!s.s)?2:0.3+(1-s.c/s.s)*2;
  if(cur&&w.u===cur)x*=3;if(last.includes(w.fr))x*=0.05;return x;
}
function pickWord(pool,cur,last){
  const ws=pool.map(w=>weight(w,cur,last));let r=Math.random()*ws.reduce((a,c)=>a+c,0);
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i];}
  return pool[0];
}
function buildPool(scope,uid){
  if(scope==='unit')return {pool:UNIT(uid).words,cur:uid};
  if(scope==='errors'){const p=ALLW.filter(w=>{const s=S.words[w.fr];return s&&s.s>s.c;});return {pool:p,cur:0};}
  if(scope==='review'){
    const p=ALLW.filter(w=>{const u=S.units[w.u];return (u&&(u.learned||u.done))||S.words[w.fr];});
    return {pool:p.length?p:UNIT(1).words,cur:0};
  }
  const ru=recUnit()||UNITS[UNITS.length-1];
  return {pool:ALLW.filter(w=>w.u<=ru.id),cur:ru.id};
}
function mkGen(pool,cur,mode){
  const types=MODES[mode],lastW=[];let lastT='';
  return ()=>{
    const w=pickWord(pool,cur,lastW);lastW.push(w.fr);if(lastW.length>3)lastW.shift();
    let t=rnd(types);if(types.length>1&&t===lastT)t=rnd(types.filter(x=>x!==lastT));lastT=t;
    return t==='cross'?(mkCross(pool)||mkEx('order',w)):mkEx(t,w);
  };
}

let R=null,learning=false,view={name:'home'};
const app=$('#app');

function startRun(cfg){
  R=Object.assign({n:0,ok:0,xp:0,sec:0,over:false,paused:false,answered:false,words:new Set(),hist:[],pos:-1},cfg);
  learning=true;nextQ();
}
function nextQ(){
  if(!R)return;
  if(R.minutes&&R.over)return endRun();
  const ex=R.gen(R);if(!ex)return endRun();
  R.hist.push(ex);R.pos=R.hist.length-1;showEx();
}
function showEx(){R.cur=R.hist[R.pos];R.answered=!!R.cur.done;view={name:'run'};render();}
function restoreEx(ex){
  $$('#exbody button:not(.spk),#exbody input:not(.cx)').forEach(x=>{x.disabled=true;});
  if(ex.kind==='mcq'&&ex.opts)$$('.opt').forEach((o,k)=>{if(ex.opts[k].ok)o.classList.add('ok');else if(ex.picked===k)o.classList.add('no');});
  const inp=$('#ans');if(inp&&ex.val!=null)inp.value=ex.val;
  $('#fb').innerHTML=ex.fb||'';
}

/* ───────── Mots croisés audio ───────── */
const cw=t=>norm(t).replace(/[^a-z]/g,'');
function crossLayout(words){
  const g=new Map(),pl=[],K=(r,c)=>r+','+c;
  const cells=(w,r,c,d)=>[...w.k].map((ch,i)=>({ch,r:r+(d?i:0),c:c+(d?0:i)}));
  const can=(w,r,c,d)=>{
    if(g.has(K(r-(d?1:0),c-(d?0:1))))return false;
    if(g.has(K(r+(d?w.k.length:0),c+(d?0:w.k.length))))return false;
    let cross=0;
    for(const x of cells(w,r,c,d)){
      const e=g.get(K(x.r,x.c));
      if(e){if(e!==x.ch)return false;cross++;}
      else if(d?(g.has(K(x.r,x.c-1))||g.has(K(x.r,x.c+1))):(g.has(K(x.r-1,x.c))||g.has(K(x.r+1,x.c))))return false;
    }
    return cross===1;
  };
  const add=(w,r,c,d)=>{cells(w,r,c,d).forEach(x=>g.set(K(x.r,x.c),x.ch));pl.push({w,r,c,d});};
  add(words[0],0,0,0);
  for(const w of words.slice(1)){
    let done=false;
    for(const q of shuffle(pl)){
      if(done)break;
      for(let i=0;i<w.k.length&&!done;i++)for(let j=0;j<q.w.k.length&&!done;j++){
        if(w.k[i]!==q.w.k[j])continue;
        const d=q.d?0:1,r=d?q.r-i:q.r+j,c=d?q.c+j:q.c-i;
        if(can(w,r,c,d)){add(w,r,c,d);done=true;}
      }
    }
  }
  if(pl.length<4)return null;
  const rs=pl.map(x=>x.r),cs=pl.map(x=>x.c);const r0=Math.min(...rs),c0=Math.min(...cs);
  const o=pl.map(x=>({w:x.w,r:x.r-r0,c:x.c-c0,d:x.d}));
  const gg={};let H=0,W=0;
  o.forEach(x=>cells(x.w,x.r,x.c,x.d).forEach(y=>{gg[y.r+','+y.c]=y.ch;H=Math.max(H,y.r+1);W=Math.max(W,y.c+1);}));
  if(W>10||H>10)return null;
  o.sort((a,b)=>a.r-b.r||a.c-b.c);
  return {words:o,g:gg,w:W,h:H};
}
function mkCross(pool){
  const seen=new Set(),cand=[];
  pool.forEach(w=>{const k=cw(w.fr);if(k.length>=3&&k.length<=8&&!/[\s'…\/()]/.test(w.fr)&&!seen.has(k)){seen.add(k);cand.push({fr:w.fr,k});}});
  if(cand.length<4)return null;
  for(let a=0;a<40;a++){
    const ws=shuffle(cand).slice(0,6).sort((x,y)=>y.k.length-x.k.length);
    const L=crossLayout(ws);
    if(L)return {kind:'cross',L,head:b('Mots croisés : écoute et écris','Bulmaca: dinle ve yaz'),info:{correct:L.words.map(x=>'<b>'+esc(x.w.fr)+'</b>').join(' · ')}};
  }
  return null;
}

/* reconnaissance vocale : écoute, compare avec le mot attendu */
function recog(target,cb){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){cb({err:'unsupported'});return;}
  let done=false;const end=r=>{if(!done){done=true;cb(r);}};
  try{
    const r=new SR();r.lang='fr-FR';r.interimResults=false;r.maxAlternatives=4;
    r.onresult=e=>{
      const alts=[...e.results[0]].map(a=>a.transcript);const tg=norm(target);let best=0;
      alts.forEach(a=>{const n=norm(a);best=Math.max(best,1-lev(n,tg)/Math.max(n.length,tg.length,1));});
      end({ok:best>=0.75,heard:alts[0],score:best});
    };
    r.onerror=e=>end({err:(e&&e.error)||'error'});
    r.onnomatch=()=>end({ok:false,heard:''});
    r.onend=()=>end({ok:false,heard:''});
    r.start();
  }catch(e){end({err:'start'});}
}
function pronHtml(res){

async function shrink(file){

  const cv=document.createElement('canvas');cv.width=Math.round(bm.width*sc);cv.height=Math.round(bm.height*sc);

}

/* ───────── Export PDF (pages dessinées puis assemblées) ───────── */
function bytesFromDataURL(u){const bin=atob(u.split(',')[1]);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function pdfFromCanvases(cvs){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length;};
  const obj=(n,body)=>{offs[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n');};
  const N=cvs.length;push('%PDF-1.4\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids ['+cvs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']/Count '+N+'>>');
  cvs.forEach((cv,i)=>{
    const jpg=bytesFromDataURL(cv.toDataURL('image/jpeg',.85)),c='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(3+3*i,'<</Type/Page/Parent 2 0 R/MediaBox [0 0 595 842]/Resources<</XObject<</Im0 '+(5+3*i)+' 0 R>>>>/Contents '+(4+3*i)+' 0 R>>');
    obj(4+3*i,'<</Length '+c.length+'>>\nstream\n'+c+'\nendstream');
    offs[5+3*i]=len;push((5+3*i)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+cv.width+'/Height '+cv.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>\nstream\n');
    push(jpg);push('\nendstream\nendobj\n');
  });
  const xr=len,total=3*N+3;
  push('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let n=1;n<total;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  const out=new Uint8Array(len);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length;});return out;
}
function drawPages(title,sub,rows){
  const W=1190,H=1684,M=90,pages=[];let x,y;
  const np=()=>{const cv=document.createElement('canvas');cv.width=W;cv.height=H;x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);pages.push(cv);
    x.font='24px Arial,sans-serif';x.fillStyle='#888';x.fillText("Le Jardin d'Aslı · "+VERSION+' · '+pages.length,M,H-50);y=M;};
  np();x.fillStyle='#111';x.font='bold 56px Arial,sans-serif';x.fillText(title,M,y+50);y+=90;
  x.font='28px Arial,sans-serif';x.fillStyle='#555';x.fillText(sub,M,y);y+=60;
  rows.forEach(r=>{
    const h=r.h?90:r.line?120:150;
    if(y+h>H-110)np();
    if(r.h){x.fillStyle='#1d2146';x.font='bold 36px Arial,sans-serif';x.fillText(r.h,M,y+40);y+=h;return;}
    if(r.line){x.fillStyle='#444';x.font='30px Arial,sans-serif';x.fillText(r.line,M,y+30);x.strokeStyle='#999';x.lineWidth=2;x.beginPath();x.moveTo(M,y+85);x.lineTo(W-M,y+85);x.stroke();y+=h;return;}
    x.fillStyle='#111';x.font='bold 36px Arial,sans-serif';x.fillText(r.fr,M,y+34);
    x.fillStyle='#b3232f';x.font='32px Arial,sans-serif';x.fillText(r.tr||'',M+560,y+34);
    x.fillStyle='#333';x.font='italic 28px Arial,sans-serif';x.fillText(r.xf||'',M,y+82);
    x.fillStyle='#777';x.font='26px Arial,sans-serif';x.fillText(r.xt||'',M,y+118);y+=h;
  });
  return pages;
}
async function savePdf(name,pages){
  let dl=null;try{dl=await window.claude.use('downloads');}catch(e){}
  if(!dl){toast(b("L'export n'est pas disponible ici.","Dışa aktarma burada kullanılamıyor."));return;}
  try{await dl.save({filename:name,data:new Blob([pdfFromCanvases(pages)],{type:'application/pdf'})});}
  catch(e){if(!e||e.code!=='declined')toast(b("Export impossible.","Dışa aktarılamadı."));}
}

  return '<div class="h1" style="text-align:center">'+b('Bravo, '+esc(S.name)+' !','Aferin, '+esc(S.name)+'!')+'</div>'+
  '<div class="sum">'+
   '<div class="tile px">'+icon('check','var(--green)',28)+'<b>'+r.ok+'/'+r.n+'</b><span>'+b('bonnes réponses','doğru cevap')+'</span></div>'+
   '<div class="tile px">'+icon('star','var(--gold)',28)+'<b>'+pc+'%</b><span>'+b('réussite','başarı')+'</span></div>'+
   '<div class="tile px">'+icon('clock','var(--blue)',28)+'<b>'+Math.max(1,Math.round(r.sec/60))+"'</b><span>"+b('de travail','çalışma')+'</span></div>'+
   '<div class="tile px">'+icon('flame','var(--red)',28)+'<b>+'+r.xp+'</b><span>XP</span></div>'+
  '</div>'+view.extra+
  (giftsAvail()?'<div class="panel px">'+b('Un cadeau t\'attend !','Seni bir hediye bekliyor!')+'<button class="btn red" data-go="gifts">'+b('Voir mes cadeaux','Hediyelerime bak')+'</button></div>':'')+
  backBtn('green',b('Continuer','Devam'))+
  (S.last.mode&&view.res.kind==='session'?'<button class="btn ghost" data-act="start">'+b('Encore une séance','Bir ders daha')+'</button>':'');
}
function renderNav(){
  const items=[['home','home',b('Accueil','Ana sayfa')],['path','path',b('Parcours','Yol')],['suivi','cal',b('Suivi','Takvim')],['gifts','gift',b('Cadeaux','Hediye')],['settings','gear',b('Réglages','Ayarlar')]];
  const cur=['setup','unit','summary'].includes(view.name)?(view.name==='unit'?'path':'home'):view.name;
  $('#navin').innerHTML=items.map(([id,ic,l])=>'<button class="nb '+(cur===id?'on':'')+'" data-go="'+id+'" aria-label="'+id+'">'+icon(ic,'currentColor',28)+'<span>'+l+'</span>'+(id==='gifts'&&giftsAvail()?'<i class="dot"></i>':'')+'</button>').join('');
}
function render(){
  const n=view.name;
  $('#nav').hidden=(n==='run'||n==='lesson'||n==='photo');
  if(n==='run'){renderRunView();return;}
  app.innerHTML=({photo:vPhoto,home:vHome,setup:vSetup,path:vPath,unit:vUnit,lesson:vLesson,suivi:vSuivi,gifts:vGifts,settings:vSettings,summary:vSummary})[n]();
  renderNav();
  if(n==='home'){mountGarden();const bc=$('#bella');if(bc)drawBella(bc);}
  if(n==='gifts')$$('.gift canvas').forEach(cv=>drawFlower(cv,cv.dataset.c,4));
}

/* étoiles de fond */
(function(){
  let s=[],seed=7;const r=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let i=0;i<34;i++)s.push(Math.floor(r()*1400)+'px '+Math.floor(r()*1000)+'px 0 0 rgba(255,255,255,'+(0.25+r()*0.5).toFixed(2)+')');
  $('#stars').style.boxShadow=s.join(',');
})();


render();
cloudInit();
})();
</script>
